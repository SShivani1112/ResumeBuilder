<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — ResumeForge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">Resume<span>Forge</span></div>
    <nav><a href="{{ url_for('home') }}">Home</a></nav>
  </header>

  <main class="wrap-narrow">
    <span class="eyebrow">Optional account</span>
    <h1>Create an account</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}

    <form method="POST" class="section-block">
      <div class="field-row single">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required>
        </div>
      </div>
      <div class="field-row single">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>
      <div class="field-row single">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
      </div>
      <div class="section-actions">
        <button class="btn" type="submit">Register</button>
      </div>
    </form>
    <p class="eyebrow">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </main>
</body>
</html>
